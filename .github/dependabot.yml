version: 2
updates:
  # 保持 .github/workflows/ 中使用 SHA 固定的 GitHub Actions 为最新版本。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # 将常规 Action 升级合并到一个 PR 中以减少噪声；
      # major 版本仍单独创建 PR，便于逐项审查。
      github-actions:
        update-types:
          - "minor"
          - "patch"
