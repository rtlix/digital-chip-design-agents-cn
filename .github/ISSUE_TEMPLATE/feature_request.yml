name: "🚀 功能建议"
description: 建议改进 Agent、workflow 或系统能力
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请提出对数字芯片设计 Agent 系统的改进建议。

  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 你遇到了什么限制或能力缺口？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述希望增加的功能或改进

  - type: textarea
    id: workflow
    attributes:
      label: 受影响流程
      description: 哪个 workflow 或 Agent flow 会受到影响？

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: dropdown
    id: area
    attributes:
      label: 所属领域
      options:
        - Agent 行为
        - Workflow 编排
        - 代码生成
        - 工具 / 脚本
        - 文档
        - 其他

  - type: textarea
    id: benefit
    attributes:
      label: 预期收益
      description: 为什么这项改进有价值？例如自动化程度、准确性或易用性提升
