name: "🐞 Bug 报告"
description: 报告 Agent、workflow 或设计输出中的问题
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请报告 Agent、workflow 或生成的设计 artifact 中出现的非预期行为。

  - type: input
    id: component
    attributes:
      label: 受影响组件
      description: 仓库的哪个部分受到影响？
      placeholder: "agent / workflow / script / config / docs"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 出现了什么问题？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小可复现流程
      placeholder: |
        1. 运行 agent/workflow...
        2. 提供输入...
        3. 观察输出...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 正确情况下应该发生什么？
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: 相关 Artifact
      description: Log、生成文件、配置或输出

  - type: dropdown
    id: impact
    attributes:
      label: 影响程度
      options:
        - 轻微不便
        - 影响工作流程
        - 阻塞使用
        - 严重（系统不可用)
