name: 中文化语法 Smoke Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cn-smoke.yml"
      - "bin/install.mjs"
      - "install.sh"
      - "install.ps1"
      - "plugins/infrastructure/skills/memory-keeper/*.py"
      - "tools/experience_search.py"
      - "tools/qor_trends.py"
  workflow_dispatch:

jobs:
  syntax:
    name: 检查翻译后的脚本语法
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 检查 Node 安装器
        run: |
          node --check bin/install.mjs
          node bin/install.mjs --help
      - name: 检查 Bash 安装器
        run: |
          bash -n install.sh
          bash install.sh --help
      - name: 检查 PowerShell 安装器
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "./install.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - name: 检查 Python CLI
        run: |
          python3 -m py_compile \
            plugins/infrastructure/skills/memory-keeper/distill.py \
            plugins/infrastructure/skills/memory-keeper/memory_root.py \
            tools/experience_search.py \
            tools/qor_trends.py
          python3 plugins/infrastructure/skills/memory-keeper/distill.py --help >/dev/null
          python3 plugins/infrastructure/skills/memory-keeper/memory_root.py --help >/dev/null
          python3 tools/experience_search.py --help >/dev/null
          python3 tools/qor_trends.py --help >/dev/null
