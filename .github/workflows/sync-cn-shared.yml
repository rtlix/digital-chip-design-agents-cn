name: 同步中文版共享区块

on:
  push:
    branches: [main]
    paths:
      - "tools/agent_shared_sections.md"
      - ".github/workflows/sync-cn-shared.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: 同步 Orchestrator 共享区块
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 同步共享区块
        run: python3 tools/sync_agent_sections.py
      - name: 提交同步结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins ides
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs(cn): sync translated shared sections"
            git push origin main
          fi
