name: Sync translated shared sections

on:
  push:
    branches: [main]
    paths:
      - "tools/agent_shared_sections.md"
      - ".github/workflows/sync-cn-shared.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared sections
        run: python3 tools/sync_agent_sections.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins ides
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs(cn): sync translated shared sections"
            git push origin main
          fi
